<!doctype html>
<!--
  Skill: gpt-tasteskill (GSAP-timelines, grote Produkt-typografie, veel lucht), uitgevoerd binnen de harde bol-huisstijl.
  Concept: een presentatie in acht hoofdstukken die zich opbouwt uit één prompt, van de handmatige editor van vandaag via zeven parallel gebouwde ontwerpen naar de AI-tussenlaag van Dignify en wat daarna kan.
  Keuzes: geen paginascroll maar één scène per hoofdstuk met een eigen timeline; de HTML van elke scène is meteen de eindstand, zodat reduced motion of een ontbrekende GSAP alles direct toont.
  De editor is generiek nagebootst met de echte bloktypes en copy uit content.json, de zeven ontwerpen zijn echte iframes van de varianten die pas laden als hoofdstuk 3 start.
  Alternatieven die ik overwoog: één lange gepinde scrollpagina (lastiger om live te presenteren) en een donkere keynote-stijl (past niet bij bol).
-->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bol: presentatie</title>
<style>
  @font-face{font-family:Graphik;src:url(https://assets.s-bol.com/nl/static/assets/webfonts/Graphik/Graphik-Regular-Web.woff2)format("woff2");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:Graphik;src:url(https://assets.s-bol.com/nl/static/assets/webfonts/Graphik/Graphik-Semibold-Web.woff2)format("woff2");font-weight:600;font-style:normal;font-display:swap}
  @font-face{font-family:Produkt;src:url(https://assets.s-bol.com/nl/static/assets/webfonts/Produkt/Produkt-Light-Web.woff2)format("woff2");font-weight:300;font-style:normal;font-display:swap}
  @font-face{font-family:Produkt;src:url(https://assets.s-bol.com/nl/static/assets/webfonts/Produkt/Produkt-Bold-Web.woff2)format("woff2");font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:Produkt;src:url(https://assets.s-bol.com/nl/static/assets/webfonts/Produkt/Produkt-Super-Web.woff2)format("woff2");font-weight:900;font-style:normal;font-display:swap}

  :root{
    --blue:#0000A4;--act:#0000FF;--hov:#0561FD;--low:#D2E1FF;--min:#EDF3FF;--grey:#F6F6F6;
    --ink:#131313;--mid:#6D6D6D;--line:#D8D8D8;--yel:#FDB501;--yel-h:#FB9700;--bronze:#FFE0C7;
    --sh1:0 2px 2px rgba(3,3,27,.08),0 0 2px rgba(3,3,27,.16);
    --sh2:0 3px 3px rgba(3,3,27,.08),0 0 3px rgba(3,3,27,.16);
    --shL:0 24px 48px -18px rgba(0,0,164,.24),0 2px 4px rgba(3,3,27,.06);
    --fd:Produkt,Arial,Helvetica,sans-serif;--fb:Graphik,Arial,Helvetica,sans-serif;
    --pad:64px;--topH:80px;--botH:104px;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#fff;color:var(--ink);font:400 16px/1.5 var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit}
  svg{display:block}
  .sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  :focus-visible{outline:2px solid var(--act);outline-offset:2px}
  .app[data-tone=dark] :focus-visible{outline-color:#fff}

  /* chrome */
  .app{position:fixed;inset:0;overflow:hidden}
  .top{position:absolute;left:0;right:0;top:0;z-index:10;height:var(--topH);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:40px;padding:0 var(--pad)}
  .brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
  .brand-bol{flex:none;height:26px;width:auto;color:var(--blue);overflow:visible}
  .brand-sep{flex:none;width:1px;height:24px;background:var(--line)}
  .brand-d{flex:none;height:24px;width:auto;color:#131313;--dg-mark:#6CCCD1;overflow:visible}
  .brand-x{font:400 13px/1 var(--fb);color:var(--mid)}
  .prog ol{list-style:none;margin:0;padding:0;display:flex;gap:6px}
  .prog li{flex:1;min-width:0}
  .pg{appearance:none;background:none;border:0;border-radius:4px;width:100%;min-height:48px;padding:14px 0 10px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;text-align:left;cursor:pointer;color:var(--mid)}
  .pg-l{font:600 12px/1.2 var(--fb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pg-bar{display:block;height:3px;border-radius:4px;background:var(--line);overflow:hidden}
  .pg-bar i{display:block;height:100%;background:var(--act);transform-origin:0 50%;transform:scaleX(0)}
  .pg[aria-current=step]{color:var(--blue)}
  .pg:hover{color:var(--act)}
  .skip{min-height:48px;padding:0 14px 0 18px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 14px var(--fb);display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
  .skip svg{width:18px;height:18px}
  .skip:hover{border-color:var(--act);color:var(--act)}
  .bot{position:absolute;left:0;right:0;bottom:0;z-index:10;height:var(--botH);display:flex;align-items:center;gap:16px;padding:0 var(--pad)}
  .hint{margin:0 auto 0 4px;font-size:13px;color:var(--mid)}
  .btn-prev{min-height:48px;padding:0 18px 0 14px;border-radius:8px;border:1px solid var(--act);background:#fff;color:var(--act);font:600 14px var(--fb);display:inline-flex;align-items:center;gap:8px;cursor:pointer}
  .btn-prev:hover{box-shadow:var(--sh2)}
  .btn-next{min-height:56px;padding:0 24px 0 30px;border-radius:8px;border:0;background:var(--act);color:#fff;font:600 16px var(--fb);display:inline-flex;align-items:center;gap:12px;cursor:pointer;box-shadow:var(--sh1)}
  .btn-next:hover{background:var(--hov);box-shadow:var(--sh2)}
  .btn-next{position:relative}
  .btn-next.ready::after{content:"";position:absolute;inset:-7px;border-radius:13px;border:3px solid var(--yel);pointer-events:none;animation:nxRing 1.6s ease-out infinite}
  .btn-next.ready svg{animation:nxArrow 1s ease-in-out infinite}
  @keyframes nxRing{0%{opacity:1;transform:scale(.97)}100%{opacity:0;transform:scale(1.14)}}
  @keyframes nxArrow{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  .hint.ready{font-weight:600;opacity:1}
  .app[data-tone=dark] .hint.ready{color:#fff}
  .app:not([data-tone=dark]) .hint.ready{color:var(--blue)}
  @media (prefers-reduced-motion: reduce){.btn-next.ready::after{animation:none;opacity:1}.btn-next.ready svg{animation:none}}
  .btn-next svg,.btn-prev svg{width:20px;height:20px}
  .is-off{visibility:hidden}
  .app[data-tone=dark] .brand-d,.app[data-tone=dark] .brand-bol{color:#fff}
  .app[data-tone=dark] .brand-d{--dg-mark:#AEF2F4}
  .app[data-tone=dark] .brand-sep{background:rgba(255,255,255,.35)}
  .app[data-tone=dark] .brand-x,.app[data-tone=dark] .hint{color:rgba(255,255,255,.75)}
  .app[data-tone=dark] .pg{color:rgba(255,255,255,.7)}
  .app[data-tone=dark] .pg[aria-current=step],.app[data-tone=dark] .pg:hover{color:#fff}
  .app[data-tone=dark] .pg-bar{background:rgba(255,255,255,.25)}
  .app[data-tone=dark] .pg-bar i{background:#fff}
  .app[data-tone=dark] .skip{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
  .app[data-tone=dark] .btn-next{background:#fff;color:var(--blue)}
  .app[data-tone=dark] .btn-prev{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}

  /* scenes */
  .stage{position:absolute;inset:0;z-index:1}
  .scene{position:absolute;inset:0;visibility:hidden;opacity:0;background:#fff}
  .scene.on{visibility:visible;opacity:1}
  .s2,.s6{background:var(--grey)}
  .s4{background:var(--min)}
  .s5{background-color:#fff;background-image:radial-gradient(var(--low) 1px,transparent 1.4px);background-size:24px 24px}
  .s7{background:radial-gradient(120% 95% at 50% 62%,#0000FF 0%,#0000A4 60%)}
  .inner{position:absolute;inset:0;max-width:1440px;margin:0 auto;padding:calc(var(--topH) + 16px) var(--pad) var(--botH);display:flex;flex-direction:column}
  .copy{flex:none;max-width:1000px;margin-bottom:28px}
  .ttl{margin:0;font:900 clamp(34px,4.4vw,68px)/1.02 var(--fd);color:var(--blue);letter-spacing:-.01em}
  .ttl .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
  .ttl .w>span{display:inline-block}
  .sub{margin:14px 0 0;max-width:760px;font:400 clamp(16px,1.35vw,20px)/1.45 var(--fb);color:var(--mid)}
  .scene.dark .ttl{color:#fff}
  .scene.dark .sub{color:rgba(255,255,255,.82)}
  .vis{position:relative;flex:1;min-height:0}
  .caret{display:inline-block;width:2px;height:1.1em;margin-left:2px;vertical-align:-.18em}
  .caret i{display:block;width:100%;height:100%;background:var(--act);border-radius:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  /* startbeeld: exact het eindbeeld van het laadscherm in index.html (zelfde maten), zodat de overdracht onzichtbaar is */
  .intro{position:fixed;inset:0;z-index:30;display:grid;place-content:center;overflow:hidden;pointer-events:none}
  .in-c{position:absolute;left:-2px;right:-2px;top:0;height:calc(100% + 14vh);border-radius:0 0 50% 50%/0 0 14vh 14vh;will-change:transform}
  .in-c1{background:#0000A4}
  .in-c2{background:#0561FD}
  .ld-inner{position:relative;z-index:1;display:grid;justify-items:center;gap:30px}
  .ld-logo{display:flex;align-items:center;gap:clamp(14px,2.2vw,26px)}
  .ld-bolw{position:relative;display:block;flex:none}
  .ld-logo svg.ld-bol{display:block;height:clamp(40px,7vw,76px);width:auto;overflow:visible}
  .ld-logo svg.ld-bolb{position:absolute;left:0;top:0;opacity:0}
  .ld-sep{display:block;flex:none;width:2px;height:clamp(36px,6vw,64px);background:rgba(255,255,255,.3);border-radius:2px}
  .ld-name{display:flex;align-items:center;gap:12px;color:#fff;font:700 clamp(14px,3.4vw,44px)/1 Produkt,Arial,Helvetica,sans-serif;white-space:nowrap}
  .ld-logo svg.ld-ai{display:block;flex:none;width:clamp(28px,5vw,56px);height:clamp(28px,5vw,56px);color:#FDB501;overflow:visible}
  .ld-wd{display:block;overflow:hidden;padding:.12em 0 .16em;margin:-.12em 0 -.16em}
  .ld-wd>span{display:block}
  .ld-bar{position:relative;display:block;width:min(560px,80vw);height:4px}
  .ld-bar b,.ld-bar i{position:absolute;inset:0;display:block;border-radius:4px}
  .ld-bar b{background:rgba(255,255,255,.18)}
  .ld-bar i{background:#FDB501;transform-origin:50% 50%}
  @media (prefers-reduced-motion:reduce){.intro{display:none}}
  .burst{position:fixed;left:0;top:0;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;background:var(--blue);z-index:5;opacity:0;visibility:hidden;pointer-events:none}

  /* 1: prompt */
  .s1 .inner{justify-content:center;align-items:center;text-align:center}
  .s1 .copy{margin:0 auto 40px}
  .s1 .sub{margin-left:auto;margin-right:auto}
  .s1 .vis{flex:none;width:min(920px,100%);min-height:120px;display:flex;align-items:center}
  .c1-caret{position:absolute;left:50%;top:50%;width:4px;height:56px;margin:-28px 0 0 -2px;background:var(--act);border-radius:4px;opacity:0;visibility:hidden}
  .c1-field{position:relative;width:100%;min-height:80px;display:flex;align-items:center;gap:16px;padding:12px 12px 12px 18px;background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:var(--shL);text-align:left}
  .c1-ring{position:absolute;inset:-2px;border:2px solid var(--act);border-radius:16px;opacity:0;pointer-events:none}
  .c1-ai{position:relative;flex:none;width:44px;height:44px;border-radius:8px;background:var(--min);color:var(--act);display:grid;place-items:center}
  .c1-pop{position:absolute;inset:-5px;border:2px solid var(--yel);border-radius:12px;opacity:0;pointer-events:none}
  .c1-field.typing .caret i{animation:none}
  .c1-ai svg{width:22px;height:22px}
  .c1-text{flex:1;margin:0;font:400 clamp(16px,1.6vw,22px)/1.4 var(--fb);color:var(--ink)}
  .c1-send{flex:none;display:flex;align-items:center;gap:10px}
  .kbd{font:600 12px var(--fb);color:var(--mid);border:1px solid var(--line);border-bottom-width:3px;border-radius:4px;padding:4px 8px;background:#fff}
  .c1-go{width:52px;height:52px;border-radius:8px;background:var(--act);color:#fff;display:grid;place-items:center}
  .c1-go svg{width:22px;height:22px}

  /* editor (2 en 3) */
  .ed{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shL);overflow:hidden}
  .ed-top{flex:none;height:56px;display:flex;align-items:center;gap:12px;padding:0 14px 0 20px;border-bottom:1px solid var(--line)}
  .ed-crumb{margin:0;font:600 14px var(--fb);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ed-crumb span{color:var(--mid);font-weight:400;margin-right:8px}
  .ed-status{font:600 12px var(--fb);background:var(--grey);color:var(--mid);padding:4px 10px;border-radius:4px}
  .ed-sp{flex:1}
  .ed-toast{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--fb);color:#045338;opacity:0;visibility:hidden;white-space:nowrap}
  .ed-toast svg{width:18px;height:18px}
  .ed-count{font:600 13px var(--fb);color:var(--blue);background:var(--min);padding:6px 12px;border-radius:4px;white-space:nowrap}
  .ed-save{height:40px;padding:0 18px;border-radius:8px;background:var(--act);color:#fff;font:600 14px var(--fb);display:inline-flex;align-items:center}
  .ed-body{flex:1;min-height:0;display:flex}
  .ed-side{flex:none;width:236px;background:var(--grey);border-right:1px solid var(--line);padding:16px 12px}
  .ed-side-h{margin:0 0 10px 6px;font:600 11px var(--fb);letter-spacing:.06em;text-transform:uppercase;color:var(--mid)}
  .ed-side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .ed-type{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;background:#fff;border:1px solid var(--line);border-radius:8px;font:400 13px var(--fb);color:var(--ink);white-space:nowrap;overflow:hidden}
  .ed-type svg{width:18px;height:18px;flex:none;color:var(--act)}
  .ed-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .ed-canvas{position:relative;flex:1;min-height:0;overflow:hidden;padding:16px 20px}
  .ed-list{display:flex;flex-direction:column;gap:12px}
  .ed-card{border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;background:#fff}
  .ed-card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .ed-chip{font:600 12px var(--fb);color:var(--blue);background:var(--min);padding:3px 8px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ed-n{font-size:12px;color:var(--mid)}
  .ed-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ed-f{min-width:0}
  .ed-lab{display:block;font:600 11px var(--fb);color:var(--mid);margin-bottom:4px}
  .ed-in{position:relative;display:flex;align-items:center;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:4px;font:400 14px var(--fb);color:var(--ink);white-space:nowrap;overflow:hidden}
  .ed-in .fr{position:absolute;inset:-1px;border:2px solid var(--act);border-radius:4px;opacity:0;visibility:hidden}
  .ed-in .caret{opacity:0;visibility:hidden}
  .ed-todo{flex:none;display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line);font:600 12px var(--fb);color:var(--mid)}
  .ed-sq{display:flex;gap:6px}
  .ed-sq b{position:relative;width:22px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
  .ed-sq b i{position:absolute;inset:0;background:var(--act);transform-origin:0 50%;transform:scaleX(0)}
  .ed-sq b.on i{transform:none}
  .cur{position:absolute;left:0;top:0;width:28px;height:28px;margin:-4px 0 0 -6px;z-index:4;pointer-events:none;opacity:0;visibility:hidden}
  .cur svg{width:28px;height:28px}
  .ghost{position:absolute;left:0;top:0;z-index:3;font:600 12px var(--fb);color:var(--blue);background:#fff;border:2px solid var(--act);border-radius:8px;padding:6px 10px;box-shadow:var(--shL);white-space:nowrap;opacity:0;visibility:hidden}

  /* 3: met AI */
  .c3-ab{position:absolute;inset:0;z-index:2;pointer-events:none}
  .c3-a,.c3-b{position:absolute;inset:0;visibility:hidden;opacity:0}
  .c3-a{display:flex;flex-direction:column;gap:14px}
  .c3-prompt{position:relative;flex:none;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 8px 8px 12px;background:#fff;border:2px solid var(--act);border-radius:16px;box-shadow:var(--shL)}
  .c3-prompt .c1-ai{width:40px;height:40px}
  .c3-prompt .c1-go{width:44px;height:44px}
  .c3-ptx{flex:1;margin:0;font:400 16px/1.4 var(--fb)}
  .c3-edw{position:relative;flex:1;min-height:0}
  .ed-list.fill{height:100%;gap:16px}
  .ed-list.fill .ed-card{flex:1;display:flex;flex-direction:column;padding:20px 22px 22px;border-radius:12px}
  .ed-list.fill .ed-card-h{margin-bottom:8px}
  .ed-list.fill .ed-chip{font-size:14px;padding:5px 10px}
  .ed-list.fill .ed-fields{flex:1;align-content:space-evenly;gap:18px 20px}
  .ed-list.fill .ed-lab{font-size:12px;margin-bottom:6px}
  .ed-list.fill .ed-in{height:50px;font-size:17px;padding:0 14px;border-radius:6px}
  .ed-list.rows{gap:5px}
  /* velden krimpen mee met de hoogte van het scherm: niets valt onderaan weg */
  .ed-list.fill .ed-card{flex:1 1 0;min-height:0;padding:clamp(12px,2vh,20px) 22px clamp(12px,2.2vh,22px)}
  .ed-list.fill .ed-fields{min-height:0;grid-template-rows:repeat(2,minmax(0,1fr));align-content:stretch;gap:clamp(8px,1.8vh,18px) 20px}
  .ed-list.fill .ed-f{display:flex;flex-direction:column;justify-content:center;min-height:0}
  .ed-list.fill .ed-lab{flex:none}
  .ed-list.fill .ed-in{flex:0 1 50px;height:auto;min-height:30px;font-size:clamp(13px,1.8vh,17px)}
  /* timer: vandaag traag, met AI razendsnel */
  .tmr{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 14px 0 10px;border-radius:8px;background:#FFF1CC;color:var(--ink);white-space:nowrap}
  .tmr svg{width:20px;height:20px;flex:none;color:#B26B00}
  .tmr-k{font:600 12px var(--fb);color:var(--mid)}
  .tmr-v{font:700 18px/1 var(--fb);font-variant-numeric:tabular-nums;min-width:4.2ch}
  .tmr-f{position:absolute;top:0;right:0;z-index:5;pointer-events:none;visibility:hidden}
  .tmr-ai{display:flex;align-items:stretch;height:64px;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(3,3,27,.06),var(--shL)}
  .tmr-main{display:flex;align-items:center;gap:12px;padding:0 22px 0 10px;background:var(--blue);color:#fff;border-radius:16px}
  .tmr-ic{position:relative;flex:none;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--yel) calc(var(--p,0) * 1turn),rgba(255,255,255,.16) 0)}
  .tmr-ic-in{position:absolute;inset:4px;border-radius:50%;background:var(--blue);color:var(--yel);display:grid;place-items:center}
  .tmr-ic-in svg{width:20px;height:20px}
  .tmr-ai .tmr-k{display:block;font:600 12px var(--fb);color:#D2E1FF;margin-bottom:4px;white-space:nowrap}
  .tmr-ai .tmr-v{display:block;font:700 26px/1 var(--fb);color:#fff;min-width:5ch}
  .tmr-hand{display:none;overflow:hidden;flex:none}
  .tmr-hand-in{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 22px 0 20px;white-space:nowrap}
  .tmr-ai .tmr-kk{display:grid}
  .tmr-kk>span{grid-area:1/1}
  .tmr-kk .k2{visibility:hidden;opacity:0}
  .tmr-ai .tmr-hand .tmr-k{color:var(--mid);margin-bottom:6px}
  .tmr-hand b{font:700 20px/1 var(--fb);color:var(--ink)}
  .tmr-hand small{font:400 13px var(--fb);color:var(--mid);margin-left:6px}
  .c3-b{padding-top:80px}
  .ed-sum{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;border-radius:8px;background:#FFF1CC;color:var(--ink);font:400 15px var(--fb);white-space:nowrap;visibility:hidden;opacity:0}
  .ed-sum svg{width:18px;height:18px;flex:none;color:#B26B00}
  .ed-sum b{font-weight:700}
  .c3-src.done{background:var(--yel);color:var(--ink)}

          [I.team, 'Training van het team', 'Jullie redacteuren leren prompten, bijsturen en goedkeuren.']
        ];
        vis.innerHTML = '<div class="c6"><div class="c6-cards">' +
          cards.map(function (c) { return '<article class="c6-card"><span class="c6-ic">' + c[0] + '</span><h3>' + c[1] + '</h3><p>' + c[2] + '</p></article>'; }).join('') +
          '</div><div class="c6-band"><p><b>Start:</b> Dignify bouwt de AI-tussenlaag en test ze samen met bol.</p><div class="c6-viz" aria-hidden="true"><div class="c6-pages"><i></i><i></i><i></i></div></div></div></div>';
      },
      build: function (t, vis, sc) {
        copyIn(t, sc, 0);
        t.from(qa(vis, '.c6-card'), { autoAlpha: 0, x: 90, duration: .8, stagger: .45, ease: 'power3.out' }, .5);
        t.from(qa(vis, '.c6-ic'), { scale: 0, rotation: -20, duration: .5, stagger: .45, ease: 'back.out(2)' }, .8);
        t.from(vis.querySelector('.c6-band'), { autoAlpha: 0, y: 30, duration: .7, ease: 'power3.out' }, 2.2);
        t.from(qa(vis, '.c6-pages i'), { autoAlpha: 0, y: 12, duration: .4, stagger: .15, ease: 'back.out(2)' }, 2.7);
      }
    },
    {
      nav: 'Daarna', title: 'Een laag die meegroeit', sub: 'Elke koppeling maakt de tussenlaag slimmer.', dark: true, a11y: true, layout: true,
      render: function (vis) {
        vis.innerHTML = '<div class="c7"><svg class="c7-svg" aria-hidden="true"></svg>' +
          '<div class="c7-pos c7-core"><span class="c7-ring"></span><div class="c7-anim"><div class="c7-box"><img class="c7-logo" src="img/dignify-logo.png" alt="Dignify" width="196" height="130"><b>AI-tussenlaag</b></div></div></div>' +
          '<ul class="sr">' + NODES.map(function (n) { return '<li>' + n + '</li>'; }).join('') + '<li>en meer koppelingen</li></ul>' +
          NODES.map(function (n) { return '<div class="c7-pos c7-node" aria-hidden="true"><span class="c7-ring"></span><div class="c7-anim"><div class="c7-box"><i class="c7-dot"></i>' + n + '</div></div></div>'; }).join('') +
          '<div class="c7-pos c7-node c7-plus" aria-hidden="true"><span class="c7-ring"></span><div class="c7-anim"><div class="c7-box">' + I.plus + '</div></div></div></div>';
        layout7(vis);
      },
      build: function (t, vis, sc) {
        const c7 = vis.querySelector('.c7'), core = c7.querySelector('.c7-core');
        const nodes = qa(c7, '.c7-node'), paths = qa(c7, '.c7-svg path'), pts = c7._pts || [];
        copyIn(t, sc, 0);
        t.from(core.querySelector('.c7-anim'), { scale: 0, duration: .8, ease: 'back.out(1.7)' }, .3);
        t.fromTo(core.querySelector('.c7-ring'), { scale: .8, autoAlpha: .8 }, { scale: 1.6, autoAlpha: 0, duration: 1.1, ease: 'power2.out' }, .7);
        nodes.forEach(function (n, i) {
          const at = 1.3 + i * .55, p = pts[i] || { ux: 0, uy: -1 };
          t.fromTo(paths[i], { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: .45, ease: 'power2.out' }, at);
          t.fromTo(n.querySelector('.c7-anim'), { x: p.ux * 70, y: p.uy * 70, autoAlpha: 0, scale: .7 }, { x: 0, y: 0, autoAlpha: 1, scale: 1, duration: .5, ease: 'back.out(2.4)' }, at + .25);
          t.fromTo(n.querySelector('.c7-ring'), { scale: .6, autoAlpha: .9 }, { scale: 1.8, autoAlpha: 0, duration: .7, ease: 'power2.out' }, at + .6);
        });
        const plus = c7.querySelector('.c7-plus');
        t.call(function () {
          extra.push(G.fromTo(plus.querySelector('.c7-ring'), { scale: .8, autoAlpha: .9 }, { scale: 2, autoAlpha: 0, duration: 1.5, repeat: -1, ease: 'power1.out' }));
          extra.push(G.to(plus.querySelector('.c7-anim'), { scale: 1.1, duration: .75, yoyo: true, repeat: -1, ease: 'sine.inOut' }));
        }, null, 1.3 + nodes.length * .55 + .4);
      }
    },
    {
      nav: 'Ontwerpen', title: 'Bekijk de zeven ontwerpen', sub: 'Elk ontwerp gebruikt de echte inhoud en de huisstijl van bol.', a11y: true,
      render: function (vis) {
        vis.innerHTML = '<button type="button" class="btn-yel" id="toDesigns">Naar de ontwerpen ' + I.arrowR + '</button><div class="c8-tiles" aria-hidden="true">' + '<i></i>'.repeat(7) + '</div>';
        vis.querySelector('#toDesigns').addEventListener('click', close);
      },
      build: function (t, vis, sc) {
        copyIn(t, sc, 0);
        t.from(vis.querySelector('.btn-yel'), { autoAlpha: 0, scale: .8, duration: .6, ease: 'back.out(2)' }, .9);
        t.from(qa(vis, '.c8-tiles i'), { autoAlpha: 0, y: 30, duration: .5, stagger: .07, ease: 'power3.out' }, 1.1);
      }
    }
  ];

  /* ---------- geometrie ---------- */
  function layout3(vis) {
    const c = vis.querySelector('.c3-c');
    const W = vis.clientWidth, H = vis.clientHeight, mob = W < 700;
    let tw = 200;
    if (!mob) {
      const per = (H - 44 - 48 - 20) / 2 - 46;
      tw = Math.floor(Math.max(150, Math.min(264, (W - 60) / 4, per * 1.6)));
    }
    c.style.setProperty('--tw', tw + 'px');
    c.style.setProperty('--s', (tw / 1440).toFixed(4));
    const s = c.querySelector('.c3-svg');
    s.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    if (mob) { s.innerHTML = ''; return; }
    const sr = rel(c.querySelector('.c3-src'), c), sx = sr.cx, sy = sr.y + sr.h;
    s.innerHTML = qa(c, '.thumb').map(function (th) {
      const r = rel(th, c), tx = r.cx, ty = r.y, my = (sy + ty) / 2;
      return '<path d="M' + sx + ' ' + sy + ' C' + sx + ' ' + my + ' ' + tx + ' ' + my + ' ' + tx + ' ' + ty + '" pathLength="1" stroke-dasharray="1"/>';
    }).join('');
  }
  function layout5(vis) {
    const c5 = vis.querySelector('.c5'), s = c5.querySelector('.c5-svg');
    s.setAttribute('viewBox', '0 0 ' + c5.clientWidth + ' ' + c5.clientHeight);
    const R = function (sel) { return rel(c5.querySelector(sel), c5); };
    const L = [link(R('.c5-team'), R('.c5-core')), link(R('.c5-core'), R('.c5-cs')), link(R('.c5-cs'), R('.c5-ok'))];
    let pk = '';
    for (let i = 0; i < 3; i++) pk += '<rect class="pk pk0" x="-9" y="-7" width="18" height="14" rx="4"/>';
    for (let i = 0; i < 3; i++) pk += '<rect class="pk pk1" x="-9" y="-7" width="18" height="14" rx="4"/>';
    s.innerHTML = L.map(function (l) { return '<path class="ln" d="' + l.d + '" pathLength="1" stroke-dasharray="1"/>'; }).join('') + pk;
    const paths = qa(s, '.ln');
    qa(c5, '.lblp').forEach(function (lb, i) {
      const p = paths[i], pt = p.getPointAtLength(p.getTotalLength() / 2);
      if (L[i].horiz) { lb.style.left = pt.x + 'px'; lb.style.top = (pt.y - 22) + 'px'; }
      else { lb.style.left = (pt.x + 74) + 'px'; lb.style.top = pt.y + 'px'; }
    });
  }
  function layout7(vis) {
    const c7 = vis.querySelector('.c7'), W = c7.clientWidth, H = c7.clientHeight, mob = W < 600;
    const cx = W / 2, cy = H / 2;
    const rx = mob ? W / 2 - 62 : Math.min(W / 2 - 130, 440), ry = mob ? H / 2 - 44 : Math.min(H / 2 - 34, 230);
    const pos = qa(c7, '.c7-pos');
    pos[0].style.left = cx + 'px'; pos[0].style.top = cy + 'px';
    const pts = [];
    for (let i = 1; i < pos.length; i++) {
      const a = -Math.PI / 2 + (i - 1) * 2 * Math.PI / (pos.length - 1);
      const x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
      pos[i].style.left = x + 'px'; pos[i].style.top = y + 'px';
      pts.push({ x: x, y: y, ux: Math.cos(a), uy: Math.sin(a) });
    }
    c7._pts = pts;
    const s = c7.querySelector('.c7-svg');
    s.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    /* lijnen van de rand van de middelste cirkel tot de rand van elk label, niet erdoor */
    const coreBox = pos[0].querySelector('.c7-box');
    const coreR = (coreBox ? coreBox.offsetWidth : 200) / 2 + 6;
    s.innerHTML = pts.map(function (p, i) {
      const box = pos[i + 1].querySelector('.c7-box');
      const hw = (box ? box.offsetWidth : 120) / 2 + 6, hh = (box ? box.offsetHeight : 48) / 2 + 6;
      let dx = cx - p.x, dy = cy - p.y;
      const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
      const tEdge = Math.min(Math.abs(dx) > 1e-6 ? hw / Math.abs(dx) : Infinity, Math.abs(dy) > 1e-6 ? hh / Math.abs(dy) : Infinity);
      const ex = p.x + dx * tEdge, ey = p.y + dy * tEdge;
      const sx = cx - dx * coreR, sy = cy - dy * coreR;
      return '<path d="M' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ' L' + ex.toFixed(1) + ' ' + ey.toFixed(1) + '" pathLength="1" stroke-dasharray="1"/>';
    }).join('');
  }

  /* ---------- opbouw ---------- */
  const app = $('app'), stage = $('stage'), live = $('live'), nextB = $('next'), prevB = $('prev'), skipB = $('skip'), burst = $('burst');
  nextB.insertAdjacentHTML('beforeend', I.arrowR);
  prevB.insertAdjacentHTML('afterbegin', I.arrowL);
  skipB.insertAdjacentHTML('beforeend', I.close);

  const scenes = CH.map(function (c, i) {
    const s = document.createElement('section');
    s.className = 'scene s' + (i + 1) + (c.dark ? ' dark' : '');
    s.setAttribute('aria-labelledby', 't' + (i + 1));
    s.innerHTML = '<div class="inner"><div class="copy"><h2 class="ttl" id="t' + (i + 1) + '">' + words(c.title) + '</h2><p class="sub">' + c.sub + '</p></div><div class="vis"' + (c.a11y ? '' : ' aria-hidden="true"') + '></div></div>';
    s.inert = true;
    s.setAttribute('inert', '');
    stage.appendChild(s);
    return s;
  });
  const navBtns = CH.map(function (c, i) {
    const li = document.createElement('li');
    li.innerHTML = '<button type="button" class="pg" data-i="' + (i + 1) + '" aria-label="Hoofdstuk ' + (i + 1) + ': ' + c.nav + '"><span class="pg-l">' + c.nav + '</span><span class="pg-bar"><i></i></span></button>';
    $('progList').appendChild(li);
    return li.firstChild;
  });
  const fills = navBtns.map(function (b) { return b.querySelector('.pg-bar i'); });

  let cur = 0, tl = null, extra = [];

  function setFill(p) {
    fills.forEach(function (f, i) {
      const v = i < cur - 1 ? 1 : (i === cur - 1 ? p : 0);
      f.style.transform = 'scaleX(' + Math.max(0, Math.min(1, v)) + ')';
    });
  }
  function setTone() { app.dataset.tone = CH[cur - 1] && CH[cur - 1].dark ? 'dark' : 'light'; }
  function stopAnims() {
    if (tl) { tl.kill(); tl = null; }
    extra.forEach(function (x) { if (x && x.kill) x.kill(); });
    extra = [];
  }
  function resetPersist(sc) {
    if (!G) return;
    G.set(qa(sc, '.ttl .w>span, .sub'), { clearProps: 'transform,opacity,visibility' });
    const c = sc.querySelector('.c3-c');
    if (c) G.set([c].concat(qa(c, '.c3-src, .trk, .sk i, iframe')), { clearProps: 'transform,opacity,visibility' });
  }

  function goTo(n, o) {
    o = o || {};
    n = Math.max(1, Math.min(CH.length, n | 0));
    if (n === cur && !o.force) return;
    const prevIdx = cur;
    stopAnims();
    if (introOn && n !== 1) endIntro(false);
    const inS = scenes[n - 1], outS = prevIdx && prevIdx !== n ? scenes[prevIdx - 1] : null, c = CH[n - 1];
    const vis = inS.querySelector('.vis');
    cur = n;

    if (G) {
      G.killTweensOf(scenes);
      scenes.forEach(function (s) { if (s !== inS && s !== outS) { s.classList.remove('on'); G.set(s, { clearProps: 'opacity,visibility,transform' }); } });
      if (!o.fromBurst) { G.killTweensOf(burst); G.set(burst, { autoAlpha: 0, scale: 0 }); }
    }
    scenes.forEach(function (s) { if (s !== inS) { s.inert = true; s.setAttribute('inert', ''); } });
    inS.inert = false;
    inS.removeAttribute('inert');

    c.render(vis);
    if (!o.fromBurst) setTone();
    navBtns.forEach(function (b, i) { if (i === n - 1) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    prevB.classList.toggle('is-off', n === 1);
    nextB.classList.toggle('is-off', n === CH.length);
    live.textContent = 'Hoofdstuk ' + n + ' van ' + CH.length + ': ' + c.title;
    try { history.replaceState(null, '', '#h' + n); } catch (e) { /* los bestand */ }
    if (n === CH.length && document.activeElement === nextB) setTimeout(function () { const y = $('toDesigns'); if (y) y.focus(); }, 50);

    if (!ANIM || o.final) {
      if (outS) { outS.classList.remove('on'); if (G) G.set(outS, { clearProps: 'opacity,visibility,transform' }); }
      inS.classList.add('on');
      if (G) G.set(inS, { clearProps: 'opacity,visibility,transform' });
      resetPersist(inS);
      setFill(1);
      return;
    }

    if (o.fromBurst) {
      if (outS) { outS.classList.remove('on'); G.set(outS, { clearProps: 'opacity,visibility,transform' }); }
      inS.classList.add('on');
      G.set(inS, { clearProps: 'opacity,visibility,transform' });
      G.to(burst, { autoAlpha: 0, duration: .6, delay: .2, ease: 'power2.out', onComplete: function () { G.set(burst, { scale: 0 }); setTone(); } });
    } else if (o.intro) {
      /* opening: de scène staat meteen klaar onder het startbeeld */
      inS.classList.add('on');
      G.set(inS, { clearProps: 'opacity,visibility,transform' });
    } else {
      if (outS) {
        G.set(outS, { autoAlpha: 1 });
        outS.classList.remove('on');
        G.to(outS, { autoAlpha: 0, y: -24, duration: .4, ease: 'power2.in', onComplete: function () { G.set(outS, { clearProps: 'opacity,visibility,transform' }); } });
      }
      inS.classList.add('on');
      G.fromTo(inS, { autoAlpha: 0, y: 28 }, { autoAlpha: 1, y: 0, duration: .6, delay: outS ? .25 : 0, ease: 'power3.out', onComplete: function () { G.set(inS, { clearProps: 'opacity,visibility,transform' }); } });
    }

    resetPersist(inS);
    markReady(false);
    const t = G.timeline({
      delay: o.intro ? 0 : (o.fromBurst ? .25 : (outS ? .3 : .05)),
      onUpdate: function () { setFill(this.progress()); },
      onComplete: function () {
        /* enkel als dit nog de tijdlijn van het getoonde hoofdstuk is: hoofdstuk 1 springt zelf door naar 2 en mag daar de knop niet laten pulseren */
        if (tl !== this || cur !== n) return;
        setFill(1);
        if (n < CH.length) markReady(true);
      }
    });
    tl = t;
    setFill(0);
    c.build(t, vis, inS);
    /* opening: wachten tot index.html het laadscherm heeft weggehaald */
    if (o.intro && !introGo) t.pause();
  }

  /* klaar met dit hoofdstuk: knop Volgende laten oplichten en de hint aanpassen */
  function markReady(on) {
    nextB.classList.toggle('ready', !!on);
    const hint = document.querySelector('.hint');
    if (hint) { hint.textContent = on ? 'Klaar. Ga verder naar de volgende stap.' : 'Pijltjes of spatie'; hint.classList.toggle('ready', !!on); }
  }

  function close() {
    if (window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'bol-presentatie', action: 'close' }, '*'); return; } catch (e) { /* val terug */ }
    }
    window.location.href = 'index.html#live';
  }

  /* ---------- bediening ---------- */
  nextB.addEventListener('click', function () { goTo(cur + 1); });
  prevB.addEventListener('click', function () { goTo(cur - 1); });
  skipB.addEventListener('click', close);
  $('progList').addEventListener('click', function (e) {
    const b = e.target.closest('.pg');
    if (b) goTo(+b.dataset.i);
  });
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'Escape') { e.preventDefault(); close(); return; }
    const onCtl = e.target && e.target.closest && e.target.closest('button, a, input, textarea, select');
    if ((k === ' ' || k === 'Enter') && onCtl) return;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); goTo(cur + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); goTo(cur - 1); }
    else if (k === 'Home') { e.preventDefault(); goTo(1); }
    else if (k === 'End') { e.preventDefault(); goTo(CH.length); }
  });
  let rt = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { if (cur && CH[cur - 1].layout) goTo(cur, { force: true, final: true }); }, 250);
  });

  /* ---------- start ---------- */
  const m = /^#h(\d+)$/.exec(window.location.hash || '');
  const start = m ? Math.max(1, Math.min(CH.length, +m[1])) : 1;
  const fontsReady = document.fonts && document.fonts.ready
    ? Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 1500); })])
    : Promise.resolve();
  const chrome = [$('brand'), $('prog'), $('bot')];
  const embedded = !!(window.parent && window.parent !== window);
  function post(action) {
    if (!embedded) return;
    try { window.parent.postMessage({ type: 'bol-presentatie', action: action }, '*'); } catch (e) { /* geen ouder */ }
  }
  function introStart() {
    if (introGo) return;
    introGo = true;
    clearTimeout(goT);
    if (introOn && tl && cur === 1) tl.play();
  }
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'bol-presentatie' && e.data.action === 'go') introStart();
  });
  introOn = ANIM && start === 1 && !!$('intro');
  if (!introOn) { const ie = $('intro'); if (ie) ie.parentNode.removeChild(ie); }
  if (ANIM && start === 1) G.set(chrome, { autoAlpha: 0 });
  fontsReady.then(function () {
    goTo(start, introOn ? { intro: true } : {});
    if (ANIM && start === 1 && !introOn) G.to(chrome, { autoAlpha: 1, duration: .8, delay: 1.4, stagger: .12, ease: 'power2.out' });
    /* eerste beeld getekend: index.html mag zijn laadscherm weghalen; vangnet als er geen 'go' komt */
    let sent = false;
    const ready = function () {
      if (sent) return;
      sent = true;
      post('ready');
      if (introOn && !introGo) goT = setTimeout(introStart, embedded ? 2000 : 300);
    };
    requestAnimationFrame(function () { requestAnimationFrame(ready); });
    setTimeout(ready, 150);
    try { window.focus(); } catch (e) { /* geen focus */ }
  });
})();
</script>
</body>
</html>
