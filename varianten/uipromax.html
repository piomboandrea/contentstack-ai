<!--
Agent: ui-ux-pro-max. Spectrum: leuk en vernieuwend. Concept: Partnervergelijker, de 4 gecertificeerde partners staan meteen onder een korte hero in een vergelijkingsmatrix die live filtert op de voorbeeldvragen uit de Partner Selector.
Keuzes: filterchips als echte toggles met aria-pressed, een semantische tabel met th en scope op desktop en een stapel partnerkaarten met criteria als chips op gsm, matchende partners schuiven naar voren en lichten op terwijl de rest zachter wordt maar blijft staan, en de uitlegblokken (situaties als aanvinkbare herkenning, stappen, voordelen met de grote 60%, Medisana voor en na, selector als blauwe scene, FAQ als accordeon) staan compact daaronder met lange teksten achter een klik.
Alternatieven die ik overwoog: een wizard die de vragen een voor een stelt (te dicht op de echte selector en traag naar het resultaat) en een slider met een partner per keer (geen overzicht, minder vergelijkbaar).
Alles komt uit content.json, de bol-schil levert header, footer, fonts en tokens; geen blur, enkel transform en opacity, reduced motion wordt gerespecteerd.
-->

  .bolx-content *,.bolx-content *::before,.bolx-content *::after{transition-duration:0s!important;animation-duration:0s!important}

  /* ---------- vergelijker: state ---------- */
  function compute() {

  function paint() {

      var cells = main.querySelectorAll('[data-p="' + r.i + '"]');
      Array.prototype.forEach.call(cells, function (el) {

        if (!active.length) { bd.hidden = true; return; }
        bd.hidden = false;
        bd.textContent = r.full ? 'Match' : r.score + ' van ' + active.length;
        bd.classList.toggle('badge--match', r.full);
        bd.classList.toggle('badge--score', !r.full);

    Array.prototype.forEach.call(main.querySelectorAll('tr[data-k]'), function (tr) {
      tr.classList.toggle('is-active', selCount(tr.getAttribute('data-k')) > 0);
    });

    var full = state.res.filter(function (r) { return r.full; }).length;
    var best = state.res.filter(function (r) { return r.match; }).length;
    if (!active.length) st.textContent = 'Kies hierboven wat bij je past.';
    else if (full === 1) st.textContent = '1 van de ' + n + ' partners past bij je keuze.';
    else if (full > 1) st.textContent = full + ' van de ' + n + ' partners passen bij je keuze.';
    else if (best > 0) st.textContent = 'Geen volledige match. ' + (best === 1 ? '1 partner komt' : best + ' partners komen') + ' het dichtst in de buurt.';
    else st.textContent = 'Geen partner past bij deze combinatie.';
    document.getElementById('cmp-clear').hidden = active.length === 0;
  }

  function reorderCards(ord) {

    var visible = wrap.offsetParent !== null && !reduced;
    var first = {};
    if (visible) Object.keys(nodes).forEach(function (k) { first[k] = nodes[k].getBoundingClientRect().top; });
    ord.forEach(function (i) { if (nodes[i]) wrap.appendChild(nodes[i]); });
    if (!visible) return;
    Object.keys(nodes).forEach(function (k) {
      var el = nodes[k], d = first[k] - el.getBoundingClientRect().top;
      if (d) { el.style.transition = 'none'; el.style.transform = 'translateY(' + d + 'px)'; }
    });

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {

      });

  }

      update();

    });

      var b = e.target.closest('button[aria-expanded][aria-controls]');

    });

    var els = main.querySelectorAll('.reveal');
    if (reduced || !('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(els, function (el) { el.classList.add('is-in'); });
    } else {
      var io = new IntersectionObserver(function (entries) {

      Array.prototype.forEach.call(els, function (el) { io.observe(el); });

      cmpHTML(block('ecosysteem'), partners, selector),
      sigHTML(block('groeiambities')),
      stepsHTML(block('wat-doet')),
      advHTML(block('voordelen')),
      medHTML(block('medisana')),
      anchorHTML(block('partner-selector')),
      selHTML(selector),
      faqHTML(block('faq'))
    ].join('');
    state = compute();
    paint();
    bind();
  }

  fetch('../content.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(init)
    .catch(function () {
      main.innerHTML = '<section class="sec"><div class="wrap"><h1>De inhoud kon niet geladen worden</h1><p class="intro">Open deze variant via de lokale server: http://localhost:8080/bol-skills/varianten/uipromax.html</p></div></section>';
    });
})();
</script>
</body>
</html>
