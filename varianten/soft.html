<!doctype html>
<!--
  Skill: soft-skill (Soft Structuralism, asymmetrische bento, zwevende kaarten met dubbele rand). Spectrum: interactief, premium. Concept: "Premium rust", bol voelt hoe duur de eigen huisstijl kan ogen zonder er iets aan te veranderen.
  Keuzes: editorial split in de hero (titel links, intro en knoppen rechts onderaan) met het bol-beeld als groot rustig paneel in een dubbele rand; bento met de 60% als blauwe scene; de 6 situaties als aanvinkbare chips die de slotzin pas tonen na een keuze; 3 stappen als tijdlijn die bij scrollen intekent; Medisana als quote-tegel met warehouse-beeld en voor/na; de Partner Selector als lichtblauwe scene met een voorbeeldkaart (gelabeld "Voorbeeld"); logo-wall die per tegel uitvouwt bij hover of focus; FAQ als rustige accordeon (opacity en transform, geen hoogte-animatie).
  Beweging: enkel transform en opacity, 500 tot 700 ms, cubic-bezier(.32,.72,0,1), onthullen via IntersectionObserver, alles meteen zichtbaar bij prefers-reduced-motion. Alle inhoud komt uit content.json; enkel korte labels (eyebrows, "Voorbeeld", "Opnieuw", "Over dit percentage", "Bekijk partnerpagina") zijn eigen tekst.
  Overwogen alternatieven: hero met het beeld als rechterhelft (verworpen: het beeld is 1200x430 en zou te hard gecropt worden); een drijvende "island" navigatie zoals de skill voorschrijft (verworpen: de bol-header blijft onaangeroerd); glas en blur uit de skill (verworpen: blur is verboden in de brief); een echte mini-selector die partners filtert op profiel (verworpen: te veel aannames, de echte selector doet dat werk).
-->
<html lang="nl-NL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bol fulfilmentpartners: soft-skill</title>
<style>
:root{--ease:cubic-bezier(.32,.72,0,1);--ring:rgba(0,0,164,.08);--shell:rgba(0,0,164,.035);--sh-float:0 1px 2px rgba(3,3,27,.06),0 12px 32px -14px rgba(0,0,164,.14),var(--bol-shadow-1);--sh-hover:0 36px 60px -30px rgba(0,0,164,.28),var(--bol-shadow-2)}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--bol-header-h, 152px) + 24px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.bolx-content{overflow-x:clip;color:var(--bol-ink)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--bol-blue-action);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{display:inline-grid;place-items:center;width:var(--s,24px);height:var(--s,24px);flex:none;line-height:0}
.ic svg{width:100%;height:100%;display:block}

.wrap{max-width:var(--bol-container);margin:0 auto;padding:0 16px}
@media(min-width:1024px){.wrap{padding:0 24px}}
.sec{padding:72px 0}
@media(min-width:768px){.sec{padding:104px 0}}
@media(min-width:1024px){.sec{padding:136px 0}}
.sec--eco{padding-bottom:40px}
.sec--selector{padding-top:0}
@media(min-width:1024px){.sec--eco{padding-bottom:72px}}

/* onthullen bij scroll: enkel opacity en transform */
.rv,.fx{opacity:0;transform:translateY(28px);transition:opacity .7s var(--ease) var(--d,0ms),transform .7s var(--ease) var(--d,0ms)}
.fx{transform:translateY(10px)}
.rv--z{transform:translateY(24px) scale(1.015)}
.rv.in,.fx.in{opacity:1;transform:translateY(0)}

/* typografie */
.eyebrow,.tag{display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:24px;background:var(--bol-blue-minimal);color:var(--bol-blue);font:600 10px/1 var(--bol-font-body);letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.tag{background:var(--bol-yellow);color:var(--bol-ink)}
h1{margin:20px 0 0;font:900 clamp(40px,5.4vw,76px)/1.02 var(--bol-font-display);letter-spacing:-.025em;color:var(--bol-blue);text-wrap:balance}
.t{margin:18px 0 0;font:700 clamp(30px,3.6vw,50px)/1.08 var(--bol-font-display);letter-spacing:-.015em;color:var(--bol-blue);text-wrap:balance;max-width:20ch}
.lead{margin:20px 0 0;font:400 17px/27px var(--bol-font-body);color:var(--bol-ink-medium);max-width:56ch}
@media(min-width:1024px){.lead{font-size:19px;line-height:30px}}
.sh{max-width:760px}

/* knoppen: 48 px, radius 8, icoon in eigen cirkel */
.btn{position:relative;display:inline-flex;align-items:center;gap:14px;min-height:48px;padding:0 8px 0 22px;border-radius:8px;border:2px solid transparent;font:600 14px/1 var(--bol-font-body);text-decoration:none;cursor:pointer;color:#fff;background:var(--bol-blue-action);isolation:isolate;transition:transform .5s var(--ease)}
.btn::before{content:"";position:absolute;inset:-2px;border-radius:8px;background:var(--bol-blue-hover);opacity:0;transition:opacity .5s var(--ease);z-index:-1}
.btn::after{content:"";position:absolute;inset:-2px;border-radius:8px;box-shadow:var(--sh-hover);opacity:0;transition:opacity .5s var(--ease);pointer-events:none}
.btn:hover::before,.btn:hover::after{opacity:1}
.btn:active{transform:scale(.98)}
.btn__i{width:32px;height:32px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none;transition:transform .5s var(--ease)}
.btn__i .ic{--s:18px}
.btn:hover .btn__i{transform:translate(2px,-1px) scale(1.06)}
.btn--s{background:#fff;color:var(--bol-blue-action);border-color:var(--bol-blue-action)}
.btn--s::before{inset:0;border-radius:6px;background:var(--bol-blue-minimal)}
.btn--s .btn__i{background:var(--bol-blue-minimal)}
.btn--xl{padding-left:28px;min-width:300px;justify-content:space-between;font-size:15px}
@media(max-width:767px){.btn--xl{width:100%;min-width:0}}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 6px;margin-left:-6px;border:0;border-radius:4px;background:none;font:600 14px/1 var(--bol-font-body);color:var(--bol-blue-action);cursor:pointer}
.tbtn .ic{transition:transform .5s var(--ease)}
.tbtn[aria-expanded=true] .ic{transform:rotate(180deg)}
.tlink{display:inline-flex;align-items:center;gap:4px;font:600 14px/20px var(--bol-font-body);color:var(--bol-blue-action);text-decoration:none;border-radius:4px}
.tlink .ic{transition:transform .5s var(--ease)}
.tlink:hover .ic{transform:translateX(3px)}

/* kaarten: zwevend, dubbele rand (schil en kern), blauwe rand bij hover */
.card{position:relative;border-radius:24px;box-shadow:var(--sh-float);transition:transform .6s var(--ease)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--bol-blue-action);opacity:0;transition:opacity .5s var(--ease);pointer-events:none;z-index:2}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:var(--sh-hover);opacity:0;transition:opacity .6s var(--ease);pointer-events:none}
.card:hover{transform:translateY(-4px)}
.card:hover::before,.card:focus-within::before,.card:hover::after{opacity:1}
.bz{background:var(--shell);border:1px solid var(--ring);border-radius:24px;padding:8px}
.bz__core{position:relative;background:#fff;border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),var(--bol-shadow-1);overflow:hidden;height:100%}

/* hero */
.hero{padding:40px 0 0}
@media(min-width:1024px){.hero{padding:72px 0 0}}
.hero__grid{display:grid;gap:28px}
@media(min-width:1024px){.hero__grid{grid-template-columns:7fr 5fr;gap:48px;align-items:end}.hero__side{padding-bottom:10px}.hero__side .lead{margin-top:0}}
.hero__actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero__media{margin-top:48px;box-shadow:var(--sh-float)}
@media(min-width:1024px){.hero__media{margin-top:72px}}
.hero__media img{display:block;width:100%;height:auto;aspect-ratio:1200/430;object-fit:cover}
@media(max-width:767px){.hero__media img{aspect-ratio:4/3}}

/* chips */
.chips{list-style:none;margin:44px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:12px;max-width:1000px}
.chips li{display:block}
@media(max-width:767px){.chips li{width:100%}}
.chip{position:relative;display:inline-flex;align-items:center;gap:12px;min-height:48px;width:100%;padding:11px 20px 11px 14px;border:0;border-radius:24px;background:#fff;box-shadow:var(--sh-float);font:400 16px/24px var(--bol-font-body);color:var(--bol-ink);text-align:left;cursor:pointer;isolation:isolate;transition:transform .5s var(--ease)}
.chip__bg{position:absolute;inset:0;border-radius:inherit;background:var(--bol-blue-low);opacity:0;transition:opacity .5s var(--ease);z-index:-1}
.chip:hover .chip__bg{opacity:.55}
.chip[aria-pressed=true] .chip__bg{opacity:1}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed=true]{color:var(--bol-blue)}
.chip__k{position:relative;width:24px;height:24px;flex:none;color:var(--bol-blue-action)}
.chip__k .ic{position:absolute;inset:0;transition:opacity .4s var(--ease),transform .4s var(--ease)}
.chip__k .ic + .ic{opacity:0;transform:scale(.5)}
.chip[aria-pressed=true] .chip__k .ic:first-child{opacity:0;transform:scale(.6)}
.chip[aria-pressed=true] .chip__k .ic + .ic{opacity:1;transform:none}
.slot{margin:36px 0 0;font:400 18px/28px var(--bol-font-body);color:var(--bol-ink);max-width:60ch}
.slot--soft{padding:20px 24px;border-radius:16px;background:var(--bol-blue-minimal);max-width:none;width:fit-content}

/* tijdlijn */
.tlw{position:relative;margin-top:56px}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:36px}
.tl__line{position:absolute;pointer-events:none;background:var(--bol-blue-low);border-radius:4px}
@media(min-width:768px){.tl{grid-template-columns:repeat(3,1fr);gap:40px}.tl__line{left:32px;right:32px;top:31px;height:2px;transform:scaleX(0);transform-origin:left center;transition:transform 1.2s var(--ease) .3s}.tlw.in .tl__line{transform:scaleX(1)}}
@media(max-width:767px){.tl__line{left:31px;top:32px;bottom:32px;width:2px;transform:scaleY(0);transform-origin:center top;transition:transform 1.2s var(--ease) .3s}.tlw.in .tl__line{transform:scaleY(1)}}
.step{position:relative;display:grid;gap:18px}
@media(max-width:767px){.step{grid-template-columns:64px 1fr;gap:20px;align-items:center}}
.step__n{width:64px;height:64px;border-radius:16px;background:#fff;box-shadow:var(--sh-float);display:grid;place-items:center;font:300 30px/1 var(--bol-font-display);color:var(--bol-blue)}
.step__t{margin:0;font:700 20px/28px var(--bol-font-display);color:var(--bol-blue);max-width:26ch}
@media(min-width:1024px){.step__t{font-size:22px;line-height:30px}}

/* bento */
.bento{display:grid;gap:16px;margin-top:48px}
@media(min-width:768px){.bento{grid-template-columns:repeat(12,1fr);gap:20px;grid-auto-flow:row dense}.tile--s{grid-column:span 5}.tile--big{grid-column:span 7;grid-row:span 2}.tile--m{grid-column:span 6}}
@media(min-width:1024px){.bento{gap:24px;margin-top:64px}}
.cell{display:grid}
.tile{height:100%}
.tile__in{padding:28px;display:flex;flex-direction:column;gap:12px;min-height:220px}
@media(min-width:1024px){.tile__in{padding:36px}}
.tile__ic{width:52px;height:52px;border-radius:16px;background:var(--bol-blue-minimal);color:var(--bol-blue);display:grid;place-items:center;margin-bottom:8px}
.tile__t{margin:0;font:700 22px/28px var(--bol-font-display);color:var(--bol-blue)}
.tile__p{margin:0;font:400 15px/24px var(--bol-font-body);color:var(--bol-ink-medium);max-width:40ch}
.tile--blue .bz__core{background:radial-gradient(120% 100% at 100% 0%,#0000FF 0%,#0000A4 62%)}
.tile--blue .tile__t{color:#fff;margin-top:auto}
.tile--blue .tile__p{color:rgba(255,255,255,.82)}
.big{font:900 clamp(88px,12vw,168px)/.9 var(--bol-font-display);letter-spacing:-.045em;color:#fff;margin:4px 0 24px}
.big__ast{font-weight:300;font-size:.42em;line-height:1;vertical-align:top;position:relative;top:.12em;margin-left:.04em}
.tile__foot{margin-top:8px}
.tile--blue .tbtn{color:#fff}
.fn{margin:12px 0 0;font:400 13px/20px var(--bol-font-body);color:rgba(255,255,255,.85);max-width:52ch}

/* medisana */
.story{display:grid}
@media(min-width:1024px){.story{grid-template-columns:5fr 7fr;min-height:540px}}
.story__img{position:relative;min-height:240px}
@media(max-width:1023px){.story__img{aspect-ratio:16/10}}
.story__img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.story__body{padding:28px 24px 32px;display:flex;flex-direction:column;align-items:flex-start}
@media(min-width:1024px){.story__body{padding:56px}}
.quote{margin:20px 0 0;padding:0}
.quote__m{display:block;color:var(--bol-blue-low);margin-bottom:8px}
.quote__t{margin:0;font:700 clamp(22px,2.2vw,30px)/1.3 var(--bol-font-display);color:var(--bol-blue);letter-spacing:-.01em;max-width:24ch}
.quote__s{margin-top:14px;font:600 14px/20px var(--bol-font-body);color:var(--bol-ink-medium)}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-top:28px;width:100%;max-width:560px}
.ba__t{border-radius:16px;background:var(--bol-blue-minimal);padding:16px 18px}
.ba__t--na{background:var(--bol-blue-low)}
.ba__l{font:600 10px/1 var(--bol-font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--bol-ink-medium)}
.ba__v{margin:10px 0 0;font:700 22px/28px var(--bol-font-display);color:var(--bol-blue)}
.ba__s{margin:4px 0 0;font:400 13px/18px var(--bol-font-body);color:var(--bol-ink-medium)}
.ba__arrow{display:grid;place-items:center;color:var(--bol-blue-action)}
.story__act{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-top:32px}
.story__more{margin:16px 0 0;font:400 15px/25px var(--bol-font-body);color:var(--bol-ink);max-width:56ch}

/* ecosysteem */
.eco{max-width:760px}
.eco__lines{margin-top:28px;display:grid;gap:14px}
.eco__l{margin:0;padding-left:20px;border-left:2px solid var(--bol-blue-low);font:400 19px/30px var(--bol-font-body);color:var(--bol-ink);max-width:56ch}
@media(min-width:1024px){.eco__l{font-size:22px;line-height:34px}}

/* selector scene */
.anchor{scroll-margin-top:calc(var(--bol-header-h, 152px) + 24px)}
.scene{position:relative;border-radius:24px;background:radial-gradient(60% 80% at 92% 8%,rgba(255,255,255,.75),rgba(255,255,255,0) 60%),linear-gradient(150deg,#EDF3FF 0%,#D2E1FF 100%);padding:40px 24px;overflow:hidden;display:grid;gap:40px;box-shadow:var(--sh-float)}
@media(min-width:1024px){.scene{grid-template-columns:6fr 5fr;gap:64px;align-items:center;padding:88px 80px}}
.scene .sh{max-width:none}
.scene .t{max-width:16ch}
.bul{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:14px;max-width:52ch}
.bul li{display:flex;gap:12px;align-items:flex-start;font:400 16px/24px var(--bol-font-body);color:var(--bol-ink)}
.bul__k{flex:none;width:24px;height:24px;border-radius:24px;background:#fff;color:var(--bol-blue-action);display:grid;place-items:center;box-shadow:var(--bol-shadow-1)}
.bul__k .ic{--s:16px}
.scene__cta{margin-top:36px}

/* voorbeeldkaart */
.pv{max-width:440px;margin:0 auto;width:100%}
.pv__core{padding:24px;display:flex;flex-direction:column;min-height:400px}
@media(min-width:1024px){.pv__core{padding:32px}}
.pv__head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pv__n{font:600 12px/1 var(--bol-font-body);color:var(--bol-ink-medium);letter-spacing:.04em}
.pv__body{margin-top:22px;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.pv__body.out{opacity:0;transform:translateX(-14px)}
.pv__q{margin:0;font:700 21px/28px var(--bol-font-display);color:var(--bol-blue)}
.pv__p{margin:10px 0 18px;font:400 15px/24px var(--bol-font-body);color:var(--bol-ink-medium)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{position:relative;height:48px;padding:0 16px;border-radius:8px;border:2px solid rgba(0,0,164,.12);background:#fff;font:400 15px/1 var(--bol-font-body);color:var(--bol-ink);text-align:left;cursor:pointer;isolation:isolate}
.opt::before{content:"";position:absolute;inset:-2px;border-radius:8px;background:var(--bol-blue-minimal);opacity:0;transition:opacity .4s var(--ease);z-index:-1}
.opt::after{content:"";position:absolute;inset:-2px;border-radius:8px;border:2px solid var(--bol-blue-action);opacity:0;transition:opacity .4s var(--ease);pointer-events:none}
.opt:hover::before,.opt[aria-pressed=true]::before,.opt:hover::after,.opt[aria-pressed=true]::after{opacity:1}
.opt[aria-pressed=true]{color:var(--bol-blue);font-weight:600}
.dots{display:flex;gap:8px;margin-top:auto;padding-top:24px}
.dot{width:8px;height:8px;border-radius:8px;background:var(--bol-blue-low);transition:transform .4s var(--ease)}
.dot--on{background:var(--bol-blue-action);transform:scale(1.25)}
.dot--done{background:var(--bol-blue)}

/* partners: logo-wall die uitvouwt */
.logos{display:grid;gap:16px;margin-top:48px}
@media(min-width:768px){.logos{grid-template-columns:repeat(2,1fr);gap:20px}}
@media(min-width:1024px){.logos{grid-template-columns:repeat(4,1fr);gap:24px;margin-top:64px}}
.pt__in{position:relative;height:420px}
.pt__logo{position:absolute;inset:0;display:grid;place-items:center;padding:32px;transition:transform .65s var(--ease)}
.pt__logo img{max-width:150px;max-height:64px;width:auto;height:auto;object-fit:contain;display:block}
.pt__panel{position:absolute;left:0;right:0;bottom:0;padding:24px;opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.pt:hover .pt__logo,.pt:focus-within .pt__logo{transform:translateY(-128px) scale(.74)}
.pt:hover .pt__panel,.pt:focus-within .pt__panel{opacity:1;transform:translateY(0)}
.pt__n{margin:0;font:700 20px/26px var(--bol-font-display);color:var(--bol-blue)}
.pt__p{margin:8px 0 12px;font:400 14px/22px var(--bol-font-body);color:var(--bol-ink-medium)}
@media(hover:none),(max-width:1023px){.pt__in{height:auto}.pt__logo{position:static;height:168px}.pt__panel{position:static;opacity:1;transform:none;padding:0 24px 28px}.pt:hover .pt__logo,.pt:focus-within .pt__logo{transform:none}}

/* faq */
.faq-wrap{max-width:880px;margin-top:48px}
.faq{padding:8px 24px}
@media(min-width:1024px){.faq{padding:12px 40px}}
.faq__item + .faq__item{border-top:1px solid var(--ring)}
.faq__h{margin:0;font:inherit}
.faq__q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;border:0;background:none;font:700 18px/26px var(--bol-font-display);color:var(--bol-blue);text-align:left;cursor:pointer;border-radius:8px}
@media(min-width:1024px){.faq__q{font-size:21px;line-height:30px;padding:26px 0}}
.faq__k{width:32px;height:32px;border-radius:16px;background:var(--bol-blue-minimal);display:grid;place-items:center;color:var(--bol-blue-action);flex:none;transition:transform .5s var(--ease)}
.faq__q[aria-expanded=true] .faq__k{transform:rotate(180deg)}
.faq__a{padding:0 0 26px}
.faq__x p{margin:0;font:400 16px/26px var(--bol-font-body);color:var(--bol-ink);max-width:60ch}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv,.fx,.rv--z{opacity:1;transform:none;transition:none}
  *,*::before,*::after{transition-duration:0s!important;animation:none!important}
  .tl__line{transform:none!important}
}
</style>
</head>
<body>
<script src="../bol-shell.js"></script>
<main class="bolx-content" id="app"></main>
<script>
(function () {
  'use strict';
  var IMG = '../';
  var app = document.getElementById('app');
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  var ICONS = {
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></svg>',
    ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M17 13.5V18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4.5"/></svg>',
    chevDown: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M5.293 8.793a1 1 0 0 1 1.414 0L12 14.086l5.293-5.293a1 1 0 1 1 1.414 1.414l-6 6a1 1 0 0 1-1.414 0l-6-6a1 1 0 0 1 0-1.414" clip-rule="evenodd"/></svg>',
    chevRight: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M9.793 16.707a1 1 0 0 1 0-1.414L13.086 12 9.793 8.707a1 1 0 0 1 1.414-1.414l4 4a1 1 0 0 1 0 1.414l-4 4a1 1 0 0 1-1.414 0" clip-rule="evenodd"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9"/></svg>',

  };

  function h(tag, attrs, kids) {

        else if (k === 'html') el.innerHTML = v;
        else if (k === 'hidden') el.hidden = true;
        else el.setAttribute(k, v === true ? '' : v);

    if (kids !== undefined && kids !== null) {

  function stagger(el, i, step) { el.style.setProperty('--d', (i * (step || 80)) + 'ms'); return el; }

  }

  }
  function cta(c, links, cls) {
    var ext = !!c.extern;
    var a = h('a', { class: 'btn ' + (cls || 'btn--p'), href: resolve(c.url, links) }, [
      h('span', { class: 'btn__t', text: c.label }),

  }
  function head(eyebrow, title, intro, id) {

  }

  var R = {};

  /* hero: titel links, intro en knoppen rechts, beeld groot eronder */
  R.hero = function (b, links) {
    var left = h('div', { class: 'rv' }, [h('span', { class: 'eyebrow', text: 'Fulfilmentpartners' }), h('h1', { id: 't-hero', text: b.titel })]);

    var media = stagger(h('div', { class: 'hero__media rv rv--z bz' }, h('div', { class: 'bz__core' },
      h('img', { src: IMG + b.beeld.src, alt: b.beeld.alt, width: b.beeld.breedte, height: b.beeld.hoogte, decoding: 'async' }))), 2, 140);
    return h('section', { class: 'hero', 'aria-labelledby': 't-hero' }, h('div', { class: 'wrap' }, [h('div', { class: 'hero__grid' }, [left, right]), media]));
  };

  /* situaties: aanvinkbare chips, slotzin verschijnt na een keuze */
  R.usp_list = function (b) {
    var slot = h('p', { class: 'slot slot--soft fx', 'aria-live': 'polite', hidden: true, text: b.slot });
    var ul = h('ul', { class: 'chips', role: 'list' });
    b.items.forEach(function (t, i) {
      var btn = h('button', { type: 'button', class: 'chip', 'aria-pressed': 'false' }, [
        h('span', { class: 'chip__bg', 'aria-hidden': 'true' }),
        h('span', { class: 'chip__k', 'aria-hidden': 'true' }, [icon('circle'), icon('checkfill')]),
        h('span', { text: t })
      ]);
      btn.addEventListener('click', function () {
        var on = btn.getAttribute('aria-pressed') === 'true';
        btn.setAttribute('aria-pressed', on ? 'false' : 'true');
        var any = ul.querySelector('[aria-pressed="true"]');
        if (any) { if (slot.hidden) fadeIn(slot); } else fadeOut(slot);
      });
      ul.appendChild(stagger(h('li', { class: 'rv' }, btn), i, 70));
    });
    return section(b.id, null, [head('Herken je dit?', b.titel, b.intro, 't-' + b.id), ul, slot], 't-' + b.id);
  };

  /* 3 stappen als tijdlijn die intekent bij scrollen */
  R.step_by_step_card = function (b) {
    var ol = h('ol', { class: 'tl', role: 'list' });
    b.stappen.forEach(function (s, i) {
      ol.appendChild(stagger(h('li', { class: 'step rv' }, [
        h('span', { class: 'step__n', 'aria-hidden': 'true', text: String(s.nummer) }),
        h('h3', { class: 'step__t', text: s.titel })
      ]), i + 1, 180));
    });
    var wrap = h('div', { class: 'tlw io' }, [h('span', { class: 'tl__line', 'aria-hidden': 'true' }), ol]);
    var slot = stagger(h('p', { class: 'slot rv', text: b.slot }), 4, 180);
    return section(b.id, null, [head('Zo werkt het', b.titel, b.intro, 't-' + b.id), wrap, slot], 't-' + b.id);
  };

  /* voordelen als bento, de 60% als blauwe scene */
  R.usp_cards = function (b) {
    var grid = h('div', { class: 'bento' });
    var sizes = ['tile--s', 'tile--big', 'tile--s', 'tile--m', 'tile--m'];
    b.items.forEach(function (it, i) {
      var big = it.cijfer !== undefined && it.cijfer !== null;
      var cls = big ? 'tile--big' : (sizes[i] || 'tile--m');
      var core = h('div', { class: 'bz__core tile__in' });
      if (big) {
        core.appendChild(h('div', { class: 'big', 'aria-hidden': 'true' }, [
          String(it.cijfer) + (it.eenheid || ''),
          it.titel.indexOf('*') > -1 ? h('span', { class: 'big__ast', text: '*' }) : null
        ]));
        core.appendChild(h('h3', { class: 'tile__t', text: it.titel }));
        core.appendChild(h('p', { class: 'tile__p', text: it.tekst }));
        if (b.voetnoot) {
          var fn = h('p', { class: 'fn fx', id: 'voetnoot', hidden: true, text: b.voetnoot });
          core.appendChild(h('div', { class: 'tile__foot' }, [disclosure('Over dit percentage', 'voetnoot', fn), fn]));
        }
      } else {
        core.appendChild(h('span', { class: 'tile__ic', 'aria-hidden': 'true' }, icon(it.icoon, 28)));
        core.appendChild(h('h3', { class: 'tile__t', text: it.titel }));
        core.appendChild(h('p', { class: 'tile__p', text: it.tekst }));
      }
      grid.appendChild(stagger(h('div', { class: 'cell rv ' + cls }, h('div', { class: 'card bz tile' + (big ? ' tile--blue' : '') }, core)), i, 90));
    });
    return section(b.id, null, [head('Voordelen', b.titel, null, 't-' + b.id), grid], 't-' + b.id);
  };

  /* medisana: quote-tegel met beeld en voor/na */
  R.medisana = function (b, links) {
    function ba(o, sub, na) {
      return h('div', { class: 'ba__t' + (na ? ' ba__t--na' : '') }, [

    }
    var more = h('p', { class: 'story__more fx', id: 'medisana-tekst', hidden: true, text: b.tekst });
    var body = h('div', { class: 'story__body' }, [
      h('span', { class: 'eyebrow', text: 'Succesverhaal' }),
      h('blockquote', { class: 'quote' }, [

      ]),

        ba(b.na, b.na.in ? 'in ' + b.na.in : '', true)
      ]),
      h('div', { class: 'story__act' }, [cta(b.cta, links, 'btn--s'), disclosure('Het verhaal in het kort', 'medisana-tekst', more)]),
      more
    ]);
    var card = h('div', { class: 'rv' }, h('div', { class: 'card bz' }, h('div', { class: 'bz__core story' }, [
      h('div', { class: 'story__img' }, h('img', { src: IMG + b.beeld.src, alt: b.beeld.alt, loading: 'lazy', decoding: 'async' })),

  };

  /* ecosysteem: de zinnen komen een voor een in beeld */
  R.text_snippet = function (b) {
    var lines = h('div', { class: 'eco__lines' });
    sentences(b.tekst).forEach(function (s, i) { lines.appendChild(stagger(h('p', { class: 'eco__l rv', text: s }), i + 1, 160)); });
    return section(b.id, 'sec--eco', h('div', { class: 'eco' }, [head('Ecosysteem', b.titel, null, 't-' + b.id), lines]), 't-' + b.id);
  };

  R.anchor_point = function (b) { return h('div', { id: b.id, class: 'anchor' }); };

  /* selector: lichtblauwe scene, 3 bullets, een grote knop, voorbeeldkaart */
  R.selector = function (b, links) {
    var ul = h('ul', { class: 'bul' });
    b.items.forEach(function (t) { ul.appendChild(h('li', null, [h('span', { class: 'bul__k', 'aria-hidden': 'true' }, icon('check')), h('span', { text: t })])); });
    var left = h('div', { class: 'scene__text rv' }, [
      head('Partner Selector', b.titel, b.tekst, 't-' + b.id), ul,
      h('div', { class: 'scene__cta' }, cta(b.cta, links, 'btn--p btn--xl'))
    ]);
    var pv = preview(b.vragenVoorbeeld);
    var right = pv ? stagger(h('div', { class: 'rv' }, pv), 1, 160) : null;
    return section(b.id, 'sec--selector', h('div', { class: 'scene' }, [left, right]), 't-' + b.id);
  };

  function preview(qs) {
    if (!qs || !qs.length) return null;
    var idx = 0, picks = [], busy = false;
    var n = h('span', { class: 'pv__n' });
    var body = h('div', { class: 'pv__body', 'aria-live': 'polite' });
    var dots = h('div', { class: 'dots', 'aria-hidden': 'true' });
    qs.forEach(function () { dots.appendChild(h('span', { class: 'dot' })); });
    function setDots() {
      Array.prototype.forEach.call(dots.children, function (d, i) {
        d.className = 'dot' + (i < idx ? ' dot--done' : (i === idx ? ' dot--on' : ''));
      });
    }
    function draw() {
      body.textContent = '';
      if (idx >= qs.length) {
        n.textContent = 'Klaar';
        body.appendChild(h('p', { class: 'pv__q', text: 'Dit was een voorbeeld.' }));
        body.appendChild(h('p', { class: 'pv__p', text: 'Je echte antwoorden geef je in de Partner Selector.' }));
        var again = h('button', { type: 'button', class: 'tbtn' }, [h('span', { text: 'Opnieuw' }), icon('arrow', 20)]);
        again.addEventListener('click', function () { idx = 0; picks = []; swap(); });
        body.appendChild(again);
      } else {
        var q = qs[idx];
        n.textContent = 'Vraag ' + (idx + 1) + ' van ' + qs.length;
        body.appendChild(h('p', { class: 'pv__q', text: q.vraag }));
        var opts = h('div', { class: 'opts', role: 'group', 'aria-label': q.vraag });
        q.opties.forEach(function (o, i) {
          var btn = h('button', { type: 'button', class: 'opt', 'aria-pressed': picks[idx] === i ? 'true' : 'false', text: o });
          btn.addEventListener('click', function () {
            if (busy) return;
            busy = true;
            picks[idx] = i;
            Array.prototype.forEach.call(opts.children, function (c, j) { c.setAttribute('aria-pressed', j === i ? 'true' : 'false'); });
            wait(360, function () { idx += 1; swap(); });
          });
          opts.appendChild(btn);
        });
        body.appendChild(opts);

      setDots();
    }
    function swap() {
      if (reduce) { draw(); busy = false; return; }
      body.classList.add('out');
      setTimeout(function () { draw(); body.classList.remove('out'); busy = false; }, 320);
    }
    draw();
    return h('div', { class: 'pv card bz' }, h('div', { class: 'bz__core pv__core' }, [
      h('div', { class: 'pv__head' }, [h('span', { class: 'tag', text: 'Voorbeeld' }), n]),
      body, dots
    ]));
  }

  /* partners: logo-wall, tegel vouwt uit bij hover of focus */
  R.card_carousel = function (b) {
    var grid = h('div', { class: 'logos' });
    b.items.forEach(function (p, i) {
      var core = h('div', { class: 'bz__core pt__in' }, [
        h('div', { class: 'pt__logo' }, h('img', { src: IMG + p.logo, alt: p.naam + ', logo', loading: 'lazy', decoding: 'async' })),

  };

  /* faq: rustige accordeon, antwoord fadet in */
  R.faq = function (b) {
    var list = h('div', { class: 'faq' });
    b.items.forEach(function (it, i) {

      var inner = h('div', { class: 'faq__x fx' }, h('p', { text: it.antwoord }));

      });
      list.appendChild(stagger(h('div', { class: 'faq__item rv' }, [h('h3', { class: 'faq__h' }, btn), panel]), i, 90));
    });
    return section(b.id, 'sec--faq', [head('FAQ', b.titel, b.subtitel, 't-' + b.id), h('div', { class: 'bz faq-wrap' }, h('div', { class: 'bz__core' }, list))], 't-' + b.id);
  };

  function initReveal() {
    var els = app.querySelectorAll('.rv, .io');
    if (reduce || !('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(els, function (e) { e.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    Array.prototype.forEach.call(els, function (e) { io.observe(e); });
  }

  function render(data) {
    var links = data.links || {};
    (data.blokken || []).forEach(function (b) {
      var fn = R[b.id] || R[b.type];
      if (!fn) return;
      var el = fn(b, links, data);
      if (el) app.appendChild(el);
    });
    initReveal();
  }

  fetch('../content.json')
    .then(function (r) { if (!r.ok) throw new Error('content.json ' + r.status); return r.json(); })
    .then(render)
    .catch(function (e) {
      app.appendChild(h('section', { class: 'sec' }, h('div', { class: 'wrap' },
        h('p', { class: 'lead', text: 'De inhoud kon niet geladen worden. Open deze pagina via http://localhost:8080/bol-skills/varianten/soft.html' }))));
      if (window.console) console.error(e);
    });
})();
