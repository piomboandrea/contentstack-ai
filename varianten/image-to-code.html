<!doctype html>
<!--
  Skill: image-to-code-skill. Spectrum: "Leuk en vernieuwend". Concept: "Geillustreerd magazijn": de hele pagina is een
  magazijn in bol-blauwe lijn- en vlakstijl, zelf getekend in SVG en CSS (geen foto's), en elk blok uit content.json is een
  zone ervan: de 6 situaties als bordjes aan de ingang, de 3 stappen als zones met een vignet, de 5 voordelen als etiketten op
  dozen op een plank, Medisana als laadperron met voor en na, de selector als loket, de 4 partners als stations op een rail en
  de FAQ als prikbord met briefjes die openklappen. Referentiebeelden: de skill vraagt eerst beelden te genereren, maar beide
  pogingen mislukten (Gemini: quota 0 op gemini-3.1-flash-image en gemini-2.5-flash-image; ChatGPT-client: composer-timeout),
  dus er zijn geen image-to-code-ref-*.png en de pagina is rechtstreeks gebouwd op de principes van de skill (schone hero,
  geen cards in cards, veel lucht, lange tekst achter een klik). Keuzes: hero met titel, een zin en een knop naast het grote
  magazijn met een traag lopende band; lange copy (Medisana, voetnoot, FAQ-antwoorden) achter aria-expanded-knoppen; partners
  op gsm als scroll-snap-carrousel. Overwogen alternatieven: de bol-foto's uit img/ als beeld in de Medisana-zone, een
  klikbare plattegrond als navigatie boven de zones, en de voorbeeldvragen van de selector als bordje aan het loket.
-->

  <!-- laadperron: vrachtwagen (vroeger) en bestelwagen (nu) -->
  <template id="art-lorry">
    <svg viewBox="0 0 130 60" aria-hidden="true" focusable="false"><g stroke="#0000A4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <rect x="4" y="8" width="78" height="38" rx="4" fill="#D2E1FF"/>
      <path d="M82 20h20q8 0 11 8l5 10v8H82Z" fill="#fff"/>
      <rect x="88" y="25" width="14" height="10" rx="2" fill="#EDF3FF"/>
      <circle cx="24" cy="48" r="7" fill="#fff"/><circle cx="24" cy="48" r="2.5" fill="#D2E1FF"/>
      <circle cx="44" cy="48" r="7" fill="#fff"/><circle cx="44" cy="48" r="2.5" fill="#D2E1FF"/>
      <circle cx="100" cy="48" r="7" fill="#fff"/><circle cx="100" cy="48" r="2.5" fill="#D2E1FF"/>
      <path d="M2 56h126"/>
    </g></svg>
  </template>
  <template id="art-van">
    <svg viewBox="0 0 130 60" aria-hidden="true" focusable="false"><g stroke="#0000A4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M4 22h14M2 32h12M6 42h10" stroke="#0000FF"/>
      <rect x="26" y="14" width="56" height="32" rx="4" fill="#fff"/>
      <path d="M82 24h20q8 0 11 8l5 8v6H82Z" fill="#D2E1FF"/>
      <rect x="88" y="28" width="14" height="10" rx="2" fill="#fff"/>
      <circle cx="42" cy="48" r="7" fill="#fff"/><circle cx="42" cy="48" r="2.5" fill="#D2E1FF"/>
      <circle cx="100" cy="48" r="7" fill="#fff"/><circle cx="100" cy="48" r="2.5" fill="#D2E1FF"/>
      <path d="M20 56h108"/>
    </g></svg>
  </template>

  <!-- wegwijzer -->
  <template id="art-sign">
    <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><g stroke="#0000A4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M28 20v92"/>
      <path d="M22 28h62l14 12-14 12H22Z" fill="#D2E1FF"/>
      <path d="M22 62h48l14 12-14 12H22Z" fill="#fff"/>
      <path d="M8 112h104"/>
      <circle cx="28" cy="18" r="4" fill="#0000A4"/>
    </g></svg>
  </template>

  <!-- loket -->
  <template id="art-loket">
    <svg viewBox="0 0 240 200" aria-hidden="true" focusable="false"><g stroke="#0000A4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M8 180h224"/>
      <rect x="40" y="28" width="160" height="152" rx="24" fill="#fff"/>
      <rect x="62" y="50" width="116" height="78" rx="12" fill="#EDF3FF"/>
      <rect x="88" y="64" width="64" height="48" rx="6" fill="#fff"/>
      <path d="M98 78h44M98 88h30M98 98h38" stroke="#D2E1FF" stroke-width="4"/>
      <rect x="50" y="128" width="140" height="12" rx="6" fill="#D2E1FF"/>
      <path d="M150 128a9 9 0 0 1 18 0Z" fill="#fff"/><circle cx="159" cy="117" r="2.5" fill="#0000A4"/>
      <rect x="90" y="4" width="60" height="16" rx="4" fill="#0000A4"/>
      <path d="M120 20v8"/>
    </g></svg>
  </template>

  <script>
  (function () {
    'use strict';
    var root = document.getElementById('app');
    var BASE = '../';

    var IC = {
      chevR: '<svg class="ic" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M9.793 16.707a1 1 0 0 1 0-1.414L13.086 12 9.793 8.707a1 1 0 0 1 1.414-1.414l4 4a1 1 0 0 1 0 1.414l-4 4a1 1 0 0 1-1.414 0" clip-rule="evenodd"/></svg>',
      chevD: '<svg class="ic chev-d" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M5.293 8.793a1 1 0 0 1 1.414 0L12 14.086l5.293-5.293a1 1 0 1 1 1.414 1.414l-6 6a1 1 0 0 1-1.414 0l-6-6a1 1 0 0 1 0-1.414" clip-rule="evenodd"/></svg>',
      arrowR: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M13 5l7 7-7 7"/></svg>',
      ext: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
      check: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#D2E1FF"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',
      truck: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>',
      chart: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V7M17 16v-8"/></svg>',
      target: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
      scale: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10V4h6M20 14v6h-6M4 4l6 6M20 20l-6-6"/></svg>',
      globe: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>'
    };

    var links = {};

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function tpl(id) {
      var t = document.getElementById(id);
      return t ? t.innerHTML : '';
    }
    function sentences(t) {
      var m = String(t || '').match(/[^.!?]+[.!?]+/g);
      return (m || [String(t || '')]).map(function (s) { return s.trim(); }).filter(Boolean);
    }
    function url(u) {
      if (typeof u === 'string' && u.indexOf('@links.') === 0) return links[u.slice(7)] || '#';
      return u || '#';
    }
    function cta(c, cls) {
      if (!c) return '';
      var ext = !!c.extern;
      return '<a class="btn ' + cls + '" href="' + esc(url(c.url)) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' +
        esc(c.label) + (ext ? IC.ext + '<span class="sr">(opent in een nieuw venster)</span>' : IC.chevR) + '</a>';
    }
    function head(b, introHtml) {
      return '<div class="head"><h2>' + esc(b.titel) + '</h2>' + (introHtml || '') + '</div>';
    }

    var R = {};

    /* 1. hero: titel, een zin, een knop, het magazijn */
    R.hero = function (b) {
      var s = sentences(b.intro);
      var zin = s[s.length - 1] || '';
      return '<section class="hero"><div class="wrap rv">' +
        '<div class="hero-text"><h1>' + esc(b.titel) + '</h1><p class="lead">' + esc(zin) + '</p>' + cta(b.cta, 'btn-primary') + '</div>' +
        '<div class="hero-art">' + tpl('art-hero') + '</div>' +
        '</div></section>';
    };

    /* 2. de ingang: zes bordjes aan een balk */
    R.groeiambities = function (b) {
      return '<section class="ingang"><div class="wrap rv">' +
        head(b, '<p class="lead">' + esc(b.intro) + '</p>') +
        '<div class="gate"><ul class="signs">' +
        (b.items || []).map(function (t) { return '<li class="sign">' + esc(t) + '</li>'; }).join('') +
        '</ul></div>' +
        (b.slot ? '<p class="after muted">' + esc(b.slot) + '</p>' : '') +
        '</div></section>';
    };

    /* 3. de zones: stap 1, 2, 3 met vignet */
    R['wat-doet'] = function (b) {
      return '<section class="zones-sec"><div class="wrap rv">' +
        head(b, '<p class="lead">' + esc(b.intro) + '</p>') +
        '<ol class="zones">' +
        (b.stappen || []).map(function (s, i) {
          return '<li class="zone">' + tpl('art-zone-' + (i + 1)) +
            '<span class="num" aria-hidden="true">' + esc(s.nummer) + '</span>' +
            '<h3><span class="sr">Stap ' + esc(s.nummer) + ': </span>' + esc(s.titel) + '</h3></li>';
        }).join('') +
        '</ol>' +
        (b.slot ? '<p class="after muted">' + esc(b.slot) + '</p>' : '') +
        '</div></section>';
    };

    /* 4. de plank: vijf dozen met een etiket */
    R.voordelen = function (b) {
      var items = (b.items || []).map(function (it) {
        var titel = esc(it.titel);
        if (it.cijfer != null) {
          var mark = esc(String(it.cijfer) + (it.eenheid || '') + '*');
          titel = titel.replace(mark, '<span class="big">' + mark + '</span>');
        }
        return '<li class="crate"><div class="lid" aria-hidden="true"></div><div class="label">' +
          (IC[it.icoon] || '') + '<h3>' + titel + '</h3><p>' + esc(it.tekst) + '</p></div></li>';
      }).join('');
      var foot = b.voetnoot ? '<div class="foot"><button type="button" class="link" data-toggle aria-expanded="false" aria-controls="voetnoot">Over het sterretje' + IC.chevD + '</button>' +
        '<p id="voetnoot" class="muted small" hidden>' + esc(b.voetnoot) + '</p></div>' : '';
      return '<section class="plank"><div class="wrap rv">' + head(b) + '<ul class="shelf">' + items + '</ul>' + foot + '</div></section>';
    };

    /* 5. het laadperron: vroeger en nu */
    R.medisana = function (b) {
      var voor = b.voor || {}, na = b.na || {};
      return '<section class="perron"><div class="wrap rv">' + head(b) +
        '<div class="dock">' +
          '<div class="bay then">' + tpl('art-lorry') + '<p class="lbl">' + esc(voor.label) + '</p><p class="val">' + esc(voor.waarde) + '</p><p class="muted">vanuit ' + esc(voor.vanuit) + '</p></div>' +
          '<div class="dock-arrow" aria-hidden="true">' + IC.arrowR + '</div>' +
          '<div class="bay now">' + tpl('art-van') + '<p class="lbl">' + esc(na.label) + '</p><p class="val">' + esc(na.waarde) + '</p><p class="muted">in ' + esc(na['in']) + '</p></div>' +
        '</div>' +
        '<div class="story">' +
          (b.quote ? '<figure><blockquote>' + esc(b.quote) + '</blockquote><figcaption>' + esc(b.quoteBron) + '</figcaption></figure>' : '') +
          '<div class="story-more"><button type="button" class="link" data-toggle aria-expanded="false" aria-controls="medisana-tekst">Wat er veranderde' + IC.chevD + '</button>' +
          '<p id="medisana-tekst" class="after" hidden>' + esc(b.tekst) + '</p></div>' +
          '<div class="actions">' + cta(b.cta, 'btn-secondary') + '</div>' +
        '</div>' +
        '</div></section>';
    };

    /* 6. wegwijzer naar het loket */
    R.ecosysteem = function (b) {
      var s = sentences(b.tekst);
      var intro = s.slice(0, 2).join(' ');
      var laatste = s.slice(2).join(' ');
      return '<section class="eco tight"><div class="wrap rv">' +
        '<div><h2>' + esc(b.titel) + '</h2><p class="lead">' + esc(intro) + '</p>' +
        (laatste ? '<a class="wegwijzer" href="#partner-selector"><span>' + esc(laatste) + '</span></a>' : '') + '</div>' +
        tpl('art-sign') +
        '</div></section>';
    };

    /* anker */
    R['partner-selector'] = function (b) {
      return '<div id="' + esc(b.id) + '" class="anchor"></div>';
    };

    /* 7. het loket */
    R.selector = function (b) {
      return '<section class="loket-band"><div class="wrap rv"><div class="loket">' +
        tpl('art-loket') +
        '<div><h2>' + esc(b.titel) + '</h2><p class="lead">' + esc(b.tekst) + '</p>' +
        '<ul class="checks">' + (b.items || []).map(function (t) { return '<li>' + IC.check + '<span>' + esc(t) + '</span></li>'; }).join('') + '</ul>' +
        '<div class="actions">' + cta(b.cta, 'btn-primary') + '</div></div>' +
        '</div></div></section>';
    };

    /* 8. de stations: vier partners op een rail */
    R.partners = function (b) {
      return '<section class="stations-sec"><div class="wrap rv">' +
        head(b, b.subtitel ? '<p class="lead">' + esc(b.subtitel) + '</p>' : '') +
        '<div class="rail"><ul class="stations">' +
        (b.items || []).map(function (p) {
          return '<li class="station">' +
            '<div class="logo"><img src="' + esc(BASE + p.logo) + '" alt="' + esc(p.naam) + '" loading="lazy"></div>' +
            '<h3>' + esc(p.naam) + '</h3><p>' + esc(p.tekst) + '</p>' +
            '<a class="link" href="' + esc(url(p.url)) + '">Meer over ' + esc(p.naam) + IC.chevR + '</a></li>';
        }).join('') +
        '</ul></div></div></section>';
    };

    /* 9. het prikbord */
    R.faq = function (b) {
      return '<section class="prikbord"><div class="wrap rv">' +
        head(b, b.subtitel ? '<p class="lead">' + esc(b.subtitel) + '</p>' : '') +
        '<ul class="board">' +
        (b.items || []).map(function (q, i) {
          var id = 'faq-a-' + i;
          return '<li class="note"><h3><button type="button" class="q" data-toggle aria-expanded="false" aria-controls="' + id + '">' +
            '<span>' + esc(q.vraag) + '</span>' + IC.chevD + '</button></h3>' +
            '<div id="' + id + '" class="a" hidden><p>' + esc(q.antwoord) + '</p></div></li>';
        }).join('') +
        '</ul></div></section>';
    };

    /* terugval op bloktype voor onbekende id's */
    R.banner_with_image = function (b) { return b.beeld ? R.hero(b) : R.selector(b); };
    R.usp_list = R.groeiambities;
    R.step_by_step_card = R['wat-doet'];
    R.usp_cards = R.voordelen;
    R.text_snippet = function (b) { return b.voor ? R.medisana(b) : R.ecosysteem(b); };
    R.anchor_point = R['partner-selector'];
    R.card_carousel = R.partners;

    function wire() {
      var btns = root.querySelectorAll('[data-toggle]');
      Array.prototype.forEach.call(btns, function (btn) {
        var tgt = document.getElementById(btn.getAttribute('aria-controls'));
        btn.addEventListener('click', function () {
          var open = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', open ? 'false' : 'true');
          if (tgt) tgt.hidden = open;
          btn.classList.toggle('open', !open);
        });
      });
    }

    function reveal() {
      var els = root.querySelectorAll('.rv');
      var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (still || !('IntersectionObserver' in window)) {
        Array.prototype.forEach.call(els, function (el) { el.classList.add('in'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
      Array.prototype.forEach.call(els, function (el) { io.observe(el); });
    }

    fetch(BASE + 'content.json')
      .then(function (r) { if (!r.ok) throw new Error('content.json ' + r.status); return r.json(); })
      .then(function (c) {
        links = c.links || {};
        var html = (c.blokken || []).map(function (b) {
          var f = R[b.id] || R[b.type];
          return f ? f(b) : '';
        }).join('');
        root.innerHTML = html;
        wire();
        reveal();
      })
      .catch(function (err) {
        root.innerHTML = '<section><div class="wrap"><h1>Ontdek Fulfilment Partners via bol</h1><p class="lead">De inhoud kon niet geladen worden. Probeer het later opnieuw.</p></div></section>';
        if (window.console) console.error(err);
      });
  })();
  </script>
</main>
