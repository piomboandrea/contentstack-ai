<!doctype html>
<!--
  Skill: gpt-tasteskill. Spectrum: Interactief. Concept: De reis van een pakket.
  Onder een compacte hero ligt een gepinde GSAP ScrollTrigger-scene: een pakket (eigen SVG in bol-blauwe lijn- en vlakstijl) rijdt van het magazijn naar de klant terwijl je scrolt, en onderweg lichten de halteborden op: eerst de zes signalen uit Ruimte voor jouw groeiambities, dan de drie stappen (opslag, verwerking en verzending, retouren) en de vijf voordelen. Daarna rijdt hetzelfde pakket nog eens voor Medisana als voor en na (3 tot 5 dagen vanuit Duitsland tegenover volgende dag in Nederland en Belgie), gevolgd door het ecosysteem als scrollende tekstonthulling, het selectorblok met een voorbeeldselector die de vier partners live markeert, en de FAQ.
  Keuzes: header niet sticky (BOL_SHELL.sticky false) zodat de scene op de bovenrand pint; op gsm volgt een camera het pakket (SVG op 260 procent breedte, alleen transform); alles blijft SVG en transforms, geen canvas; bij prefers-reduced-motion of zonder GSAP wordt dezelfde inhoud als statische blokken met gapless grids gerenderd.
  Alternatieven die ik overwoog: een horizontale scroll-scene met de voordelen als wagons (te zwaar op gsm), de hero zelf pinnen (voelt vast op de eerste scroll) en de voetnoot in het aankomstpaneel (toetsenbordval in een gescrubde scene, daarom staat hij nu als toggle net onder de scene).
  Skill-afwijkingen volgens de brief: fonts en palet van bol in plaats van Satoshi en grainy gradients, geen eigen navigatiebalk (komt uit bol-shell), geen picsum-beelden.
-->

<style>

.err{padding:48px 16px;text-align:center}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

<script>
(function () {
  'use strict';
  var REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var MOTION = !REDUCED && !!(window.gsap && window.ScrollTrigger);
  if (MOTION) window.gsap.registerPlugin(window.ScrollTrigger);
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var VB_W = 1200;
  var STEP_ICONS = ['box', 'truck', 'return'];
  var ICONS = { truck: 1, chart: 1, target: 1, scale: 1, globe: 1, box: 1, 'return': 1, flag: 1, house: 1, check: 1, chev: 1, ext: 1 };
  var PROFILE_KEYS = ['volume', 'assortiment', 'regio', 'sterkte'];
  var TRACK_D = 'M150 236 C300 236 300 120 450 120 S600 236 750 236 S900 120 1022 120';

  /* ---------- helpers ---------- */
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'text') n.textContent = v;
        else if (k === 'class') n.className = v;
        else n.setAttribute(k, v === true ? '' : v);
      });
    }
    if (kids) {
      [].concat(kids).forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
    }
    return n;
  }
  function svgEl(tag, attrs) {
    var n = document.createElementNS(SVG_NS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }
  function icon(name, cls) {
    var s = svgEl('svg', { 'class': 'ico' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true', focusable: 'false' });
    s.appendChild(svgEl('use', { href: '#i-' + (ICONS[name] ? name : 'check') }));
    return s;
  }
  function ctaLink(cta, cls, R) {
    if (!cta) return null;
    var a = el('a', { 'class': 'btn ' + cls, href: R.url(cta.url), target: cta.extern ? '_blank' : null, rel: cta.extern ? 'noopener' : null }, [cta.label]);
    if (cta.extern) {
      a.appendChild(icon('ext'));
      a.appendChild(el('span', { 'class': 'vh', text: ' (opent in een nieuw venster)' }));
    }
    return a;
  }
  function toggle(label, id, text, extraClass) {
    var btn = el('button', { 'class': 'tgl', type: 'button', 'aria-expanded': 'false', 'aria-controls': id }, [label, icon('chev')]);
    var p = el('p', { 'class': 'more ' + (extraClass || ''), id: id, hidden: true, text: text });
    btn.addEventListener('click', function () {
      var open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');

    return { btn: btn, p: p };
  }

  /* ---------- hero ---------- */
  function renderHero(b, R) {
    var h1 = el('h1', { text: String(b.titel || '') });
    var cta = el('div', { 'class': 'cta' }, [
      ctaLink(b.cta, 'btn-primary', R),
      el('a', { 'class': 'btn btn-secondary', href: '#reis' }, ['Volg het pakket'])
    ]);
    return el('section', { 'class': 'hero' }, [el('div', { 'class': 'wrap' }, [h1, el('p', { 'class': 'lead muted', text: b.intro }), cta])]);
  }

  /* ---------- scene: de reis van een pakket ---------- */
  function buildStops(list, steps, usps) {
    var stops = [{ kind: 'vertrek', phase: 0, p: 0.04, icon: 'flag', items: list.items || [], slot: list.slot || '' }];
    var st = steps.stappen || [];
    st.forEach(function (s, i) {
      stops.push({ kind: 'step', phase: 1, p: 0.13 + i * (0.27 / Math.max(1, st.length - 1)), icon: STEP_ICONS[i] || 'box', num: s.nummer, title: s.titel, text: i === st.length - 1 ? (steps.slot || '') : '' });
    });

          break;
        case 'anchor_point':
          node = el('div', { 'class': 'anchor', id: b.id });
          break;
        case 'card_carousel':
          node = renderPartners(b, R);
          break;
        case 'faq':
          node = renderFaq(b);
          break;
        default:
          node = null;
      }
      if (node) main.appendChild(node);
    });
    if (scene && scene._init) scene._init();
    initDemo(main.querySelector('.demo'), [].slice.call(main.querySelectorAll('.pc')));
    initMotion(main);
    if (MOTION) {
      window.ScrollTrigger.refresh();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { window.ScrollTrigger.refresh(); });
    }
  }

  fetch('../content.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(render)
    .catch(function (err) {
      var loading = document.getElementById('loading');
      if (loading) loading.textContent = 'De inhoud kon niet geladen worden (' + err.message + ').';
    });
})();
</script>
</body>
</html>
